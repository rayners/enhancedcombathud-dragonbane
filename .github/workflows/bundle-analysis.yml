name: Bundle Analysis

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bundle Analysis
        uses: rayners/foundry-module-actions/bundle-analysis@v6.0.1
        with:
          node-version: '24'
          minimum-change-threshold: 100
          analyze-zip: true
          zip-files: 'module.js module.json scripts/ styles/ templates/ languages/ icons/ README.md LICENSE'