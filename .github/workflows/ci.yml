name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run CI Pipeline
        uses: rayners/foundry-module-actions/ci@v6.0.0
        with:
          node-version: ${{ matrix.node-version }}
          github-packages: false
          codecov: false
